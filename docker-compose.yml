# OrbStack:  HOST_PORT=5200 docker compose up --build -d   ->  http://127.0.0.1:5200
# The server binds 0.0.0.0 INSIDE the container (P1TPX_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below. HOST_PORT must stay in 5200-5249.
name: p1-third-party-exchange

services:
  p1-third-party-exchange:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-5200}:5200"
    environment:
      SHELF_URL: ${SHELF_URL:-http://127.0.0.1:4400}
      PORT: "5200"
      P1TPX_BIND: 0.0.0.0
    volumes:
      # Optional local prefill for the browser Real tab (.data/real-prefill.json, gitignored, never a secret). Read-only.
      - ./.data:/app/.data:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5200/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 5s
      start_interval: 2s
      timeout: 5s
      retries: 3
